<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout.html}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content" class="page-wrapper bg-gra-02 p-t-130 p-b-100 font-poppins">
    <div class="wrapper wrapper--w680">
        <div class="card card-4">
            <div class="card-body">
                <h2 class="title">Thông tin mã giảm giá</h2>
                <div class="alert alert-danger" th:if="${message != null}" th:text="${message}"></div>
                <form method="POST" id="discount-code-form" th:action="${action}" th:object="${DiscountCode}">
                    <input type="hidden" th:field="*{id}">
                    <div class="row mt-3">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label class="control-label">
                                    Mã giảm giá
                                </label>
                                <span class="red_require"> *</span>
                                <input type="text" class="form-input" th:field="*{code}">
                                <span class="error"></span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label class="control-label">
                                    Ngày áp dụng
                                </label>
                                <span class="red_require"> *</span>
                                <input type="date" class="form-input" th:field="*{startDate}">
                                <span class="error"></span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label class="control-label">
                                    Ngày kết thúc
                                </label>
                                <span class="red_require"> *</span>
                                <input type="date" class="form-input" id="endDate" th:field="*{endDate}">
                                <span class="error"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-sm-4">
                            <label class="control-label">
                                Phương thức giảm
                            </label>
                            <div>
                                <input type="radio" class="custom-radio" th:field="*{type}" th:value="1"
                                       th:checked="${DiscountCode.type == 1}">
                                <label th:for="type1">Giảm theo phần trăm</label>
                                <input type="radio" class="custom-radio" th:field="*{type}" th:value="2"
                                       th:checked="${DiscountCode.type == 2}">
                                <label th:for="type2">Giảm theo tiền</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-sm-3" id="discount-by-percent">
                            <div class="form-group">
                                <label class="control-label">
                                    Phần trăm giảm (%)
                                </label>
                                <span class="red_require"> *</span>
                                <input type="text" class="form-input" th:field="*{percentage}" placeholder="VD: 2">
                                <span class="error"></span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="control-label">
                                    Số tiền áp dụng cho đơn tối thiểu từ (đ)
                                </label>
                                <span class="red_require"> *</span>
                                <input type="text" class="form-input"
                                       th:value="${#numbers.formatDecimal(DiscountCode.minimumAmountInCart, 0, 0)}"
                                       name="minimumAmountInCart" id="minimumAmountInCart"
                                       placeholder="VD: 100000 nếu áp dụng cho đơn tối từ 100.000VND">
                                <span class="error"></span>
                            </div>
                        </div>
                        <div class="col-sm-6" id="discount-by-money">
                            <div class="form-group">
                                <label class="control-label">
                                    Số tiền giảm (đ)
                                </label>
                                <span class="red_require"> *</span>
                                <input type="text" class="form-input" th:field="*{discountAmount}"
                                       placeholder="VD: 10000">
                                <span class="error"></span>
                            </div>
                        </div>
                        <div class="col-sm-3" id="max-amount-by-percent">
                            <div class="form-group">
                                <label class="control-label">
                                    Số tiền giảm tối đa (đ)
                                </label>
                                <span class="red_require"> *</span>
                                <input type="text" class="form-input" th:field="*{maximumAmount}"
                                       placeholder="VD: 20000">
                                <span class="error"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label class="control-label">
                                    Số lượng tối đa
                                </label>
                                <span class="red_require"> *</span>
                                <input type="number" class="form-input" th:field="*{maximumUsage}"
                                       placeholder="VD: 123">
                                <span class="error"></span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a th:href="@{/admin-only/discount-code}" class="btn btn-outline-danger rounded mr-1">
                            Hủy
                        </a>
                        <button class="btn-submit cursor-pointer">
                            Lưu

                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" th:inline="javascript"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script th:inline="javascript">
        $(document).ready(function () {
            var type = /*[[${DiscountCode.type}]]*/ '';
            $("#discount-by-money").hide();
            $("#discountAmount").prop('disabled', true);
            if (type == 2) {
                $("#discount-by-percent").hide();
                $("#max-amount-by-percent").hide();
                $("#discount-by-money").show();
                $("#discountAmount").prop('disabled', false);
                $('#percentage').prop('disabled', true);
                $('#maximumAmount').prop('disabled', true);
            }
            $("#type1").on("click", function () {
                $("#discount-by-money").hide();
                $("#discount-by-percent").show();
                $("#max-amount-by-percent").show();
                $("#discountAmount").prop('disabled', true);
                $('#percentage').prop('disabled', false);
                $('#maximumAmount').prop('disabled', false);
            });
            $("#type2").on("click", function () {
                $("#discount-by-money").show();
                $("#discount-by-percent").hide();
                $("#max-amount-by-percent").hide();
                $("#discountAmount").prop('disabled', false);
                $('#percentage').prop('disabled', true);
                $('#maximumAmount').prop('disabled', true);

            });
            function validateMaxAmount() {
                const minimumAmountInCart = parseFloat($('#minimumAmountInCart').val()) || 0;
                const maximumAmount = parseFloat($('#maximumAmount').val()) || 0;
                if (maximumAmount > minimumAmountInCart) {
                    Toastify({
                        text: "Số tiền giảm tối đa không được lớn hơn số tiền áp dụng cho đơn tối thiểu!",
                        className: "error",
                        style: {
                            color: "white",
                            background: "red",
                        }
                    }).showToast();
                    $('#maximumAmount').val('');
                }
            }
            $('#maximumAmount').on('input', function () {
                validateMaxAmount();
            });
            $('#minimumAmountInCart').on('input', function () {
                validateMaxAmount();
            });

            function validateDiscountAmount() {
                const minimumAmountInCart = parseFloat($('#minimumAmountInCart').val()) || 0;
                const discountAmount = parseFloat($('#discountAmount').val()) || 0;
                if (discountAmount > minimumAmountInCart) {
                    Toastify({
                        text: "Số tiền giảm không được lớn hơn số tiền áp dụng cho đơn tối thiểu!",
                        className: "error",
                        style: {
                            color: "white",
                            background: "red",
                        }
                    }).showToast();
                    $('#discountAmount').val('');
                }
            }
            $('#discountAmount').on('input', function () {
                validateDiscountAmount();
            });

            function validateEndDate() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const endDateInput = $('#endDate').val();
                if (!endDateInput) return;
                const endDate = new Date(endDateInput);
                endDate.setHours(0, 0, 0, 0);

                if (endDate <= today) {
                    Toastify({
                        text: "Ngày kết thúc phải lớn hơn ngày hiện tại!",
                        className: "error",
                        style: {
                            color: "white",
                            background: "red",
                        }
                    }).showToast();
                    $('#endDate').val('');
                }
            }

            $('#endDate').on('change', function () {
                validateEndDate();
            });

            Validator({
                form: '#discount-code-form',
                formGroupSelector: '.form-group',
                errorSelector: '.error',
                rules: [
                    Validator.isRequired('#code', 'Vui lòng nhập mã giảm giá'),
                    Validator.isRequired('#startDate', 'Vui lòng nhập ngày bắt đầu'),
                    Validator.isRequired('#endDate', 'Vui lòng nhập ngày kết thúc'),
                    Validator.isRequired('#maximumUsage', "Vui lòng nhập số lượng tối đa"),
                    Validator.isRequired('#discountAmount', "Vui lòng nhập số tiền giảm giá"),
                    Validator.isRequired('#minimumAmountInCart', "Vui lòng nhập số tiền áp dụng cho đơn tối thiểu"),
                    Validator.isRequired('#percentage', 'Vui lòng nhập phần trăm giảm'),
                    Validator.isRequired('#maximumAmount', 'Vui lòng nhập số tiền giảm tối đa mỗi đơn'),
                    Validator.maxLength('#code', 50),
                    Validator.isValidStartDateEndDate('#startDate', () => {
                        return document.querySelector('#discount-code-form #endDate').value;
                    }, 'Ngày áp dụng phải nhỏ hơn ngày kết thúc')
                ]
            });
            $("#percentage").on('input', function () {
                if (parseInt($(this).val()) > 99) {
                    $(this).val(99);
                    Toastify({
                        text: "Giảm giá tối đa 99%",
                        className: "error",
                        style: {
                            color: "white",
                            background: "red",
                        }
                    }).showToast();
                } else if (parseInt($(this).val()) < 1) {
                    $(this).val(1);
                    Toastify({
                        text: "Giảm giá tối thiểu 1%",
                        className: "error",
                        style: {
                            color: "white",
                            background: "red",
                        }
                    }).showToast();
                }
            });
            const numericFields = [
                '#discountAmount',
                '#percentage',
                '#maximumAmount',
                '#minimumAmountInCart',
                '#maximumUsage'
            ];
            numericFields.forEach(function (selector) {
                $(selector).on('input', function () {
                    // Remove any non-numeric characters
                    $(this).val($(this).val().replace(/\D/g, ''));
                });
            });

            function onlyAllowNumberInput(e) {
                const key = e.key;
                if (!/[\d\b]/.test(key)) {
                    e.preventDefault();
                }
            }

            $('#discountAmount, #minimumAmountInCart').on('input', function () {
                const type = parseInt($('#discountType').val()) || 0;

                if (type == 2) {
                    validateDiscountAmount();
                }
            });
            numericFields.forEach(function (selector) {
                $(selector).on('keypress', function (e) {
                    onlyAllowNumberInput(e);
                });
            });
        });
    </script>
</div>
</body>
</html>
